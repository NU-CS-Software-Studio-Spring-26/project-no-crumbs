<!doctype html>
<html lang="en">
  <head>
    <title>Page not found — No Crumbs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }

      body {
        background: #f7f7f5;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }

      .brand {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #111827;
        text-decoration: none;
        margin-bottom: 2.5rem;
        display: inline-block;
      }
      .brand span { color: #ff4500; }

      .code {
        font-size: 6rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -4px;
        color: #111827;
      }
      .code span { color: #ff4500; }

      .emoji { font-size: 2.5rem; margin: 1rem 0 0.5rem; }

      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 0.5rem;
      }

      p {
        color: #4b5563;
        font-size: 0.9375rem;
        line-height: 1.6;
        max-width: 26rem;
        margin: 0 auto 2rem;
      }

      a.btn {
        display: inline-block;
        background: #ff4500;
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.625rem 1.5rem;
        border-radius: 9999px;
        text-decoration: none;
        transition: background 0.15s;
      }
      a.btn:hover { background: #e53d00; }
    </style>
  </head>
  <body>
    <main>
      <a href="/" class="brand">No<span>Crumbs</span></a>
      <div class="code">4<span>0</span>4</div>
      <div class="emoji">🍽️</div>
      <h1>Nothing on the menu here</h1>
      <p>The page you're looking for doesn't exist or may have moved. Head back home and find something good.</p>
      <a href="/" class="btn">Back to NoCrumbs</a>
    </main>
  </body>
</html>
