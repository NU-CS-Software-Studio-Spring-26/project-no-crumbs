      c-1.06-3.05-1.28-6.59-0.61-10.35C47.27,5.95,34.3,11.36,24.41,20.18C13.74,29.69,6.66,43.15,5.84,58.29l0,0.05
      C5.07,73.72,10.55,87.82,20.02,98.3c9.44,10.44,22.84,17.29,38,18.1l0.05,0c15.24,0.77,29.35-4.71,39.83-14.19
      c10.44-9.44,17.29-22.84,18.1-38l0-0.05c0.07-1.34,0.09-2.64,0.06-3.91C112.98,61.34,109.96,61.51,107.13,60.74z"
      fill="#C8870A" opacity="0.25"
      transform="translate(3,5)"
      style="clip-path: none"
    />

    <!-- Chips - using original circular positions, filled with chip gradient -->
    <!-- Small chip (59.28, 62.87) -->
    <circle cx="59.28" cy="62.87" r="5.01" fill="url(#chipGrad)"/>
    <circle cx="58.0" cy="61.5" r="1.6" fill="#7A4F2E" opacity="0.55"/>

    <!-- Medium chip (37.56, 84.6) -->
    <circle cx="37.56" cy="84.6" r="6.11" fill="url(#chipGrad)"/>
    <circle cx="36.0" cy="83.0" r="2.0" fill="#7A4F2E" opacity="0.55"/>

    <!-- Small chip (50.72, 36.54) -->
    <circle cx="50.72" cy="36.54" r="4.79" fill="url(#chipGrad)"/>
    <circle cx="49.5" cy="35.3" r="1.5" fill="#7A4F2E" opacity="0.55"/>

    <!-- Crumb dot near bite (93.62, 28.3) -->
    <circle cx="93.62" cy="28.3" r="5.39" fill="url(#chipGrad)"/>
    <circle cx="92.3" cy="27.0" r="1.7" fill="#7A4F2E" opacity="0.55"/>

    <!-- Far crumb dot (97.79, 6.37) - this is outside main cookie, represents crumb -->
    <circle cx="97.79" cy="6.37" r="5.78" fill="#F0B429" stroke="#3D2B1F" stroke-width="1.5"/>

    <!-- Larger chip (76.73, 88.66) -->
    <circle cx="76.73" cy="88.66" r="8.03" fill="url(#chipGrad)"/>
    <circle cx="74.8" cy="86.8" r="2.7" fill="#7A4F2E" opacity="0.55"/>

    <!-- Largest chip (31.91, 55.47) -->
    <circle cx="31.91" cy="55.47" r="8.69" fill="url(#chipGrad)"/>
    <circle cx="29.8" cy="53.3" r="2.9" fill="#7A4F2E" opacity="0.55"/>

    <!-- Small crumb near bite (119.3, 35.98) -->
    <circle cx="119.3" cy="35.98" r="3.58" fill="#F0B429" stroke="#3D2B1F" stroke-width="1.5"/>

  </g>
</svg>
