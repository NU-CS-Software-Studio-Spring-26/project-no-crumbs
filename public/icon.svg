<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Radial gradient for cookie body depth -->
    <radialGradient id="cookieGrad" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="60%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#D9920A"/>
    </radialGradient>
    <!-- Subtle inner shadow for chips -->
    <radialGradient id="chipGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#2E1A0E"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3D2B1F" flood-opacity="0.35"/>
    </filter>
    <!-- Stroke outline filter for the cookie -->
    <filter id="outline">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="expanded"/>
      <feFlood flood-color="#3D2B1F" result="color"/>
      <feComposite in="color" in2="expanded" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon background: dark rounded square -->
  <rect width="500" height="500" rx="100" ry="100" fill="#1A1A1A"/>

  <!-- Cookie group: centered and scaled to fit nicely -->
  <!-- Original viewBox: 0 0 122.88 122.25, we want it ~340px wide centered in 500px -->
  <!-- Scale = 340/122.88 ≈ 2.768, offset = (500 - 340)/2 = 80 -->
  <g transform="translate(80, 82) scale(2.768)">

    <!-- Dark outline layer (dilated cookie shape) -->
    <path d="M101.77,49.38c2.09,3.1,4.37,5.11,6.86,5.78c2.45,0.66,5.32,0.06,8.7-2.01c1.36-0.84,3.14-0.41,3.97,0.95
